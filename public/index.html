<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flowboard</title>
  <meta name="description" content="Flowboard: a calm kanban board with live collaboration and an AI Standup Mode.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core/theme-init.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/boards" aria-label="Flowboard home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><rect x="7" y="8" width="7" height="16" rx="2" fill="#fff"/><rect x="18" y="8" width="7" height="10" rx="2" fill="#fff" opacity=".75"/></svg>
      <span>Flowboard</span>
    </a>
    <nav class="topbar-nav" data-topnav hidden>
      <a href="#/boards" class="topbar-link">Boards</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Switch to dark theme" title="Switch theme"></button>
      <div data-account></div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="overlays"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/shared/validate.js"></script>
  <script src="js/shared/markdown.js"></script>
  <script src="js/shared/activity-text.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/popover.js"></script>
  <script src="js/ui/forms.js"></script>
  <script src="js/board/store.js"></script>
  <script src="js/board/realtime.js"></script>
  <script src="js/board/dnd.js"></script>
  <script src="js/board/filters.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/board.js"></script>
  <script src="js/views/card.js"></script>
  <script src="js/views/activity.js"></script>
  <script src="js/views/standup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
